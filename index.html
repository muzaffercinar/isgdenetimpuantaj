<!DOCTYPE html>
<html lang="tr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEB İSG Hizmet ve Puantaj Yönetim Sistemi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        meb: { primary: '#1e3a5f', 'primary-light': '#2c5282', 'primary-dark': '#152a45', accent: '#d4a017', 'accent-light': '#e6b422', 'accent-dark': '#b8900f' }
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .sidebar { transition: transform 0.3s ease; }
        .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(229,231,235,0.5); }
        .dark .glass-card { background: rgba(30,41,59,0.85); border: 1px solid rgba(51,65,85,0.5); }
        .gradient-primary { background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-gray-200 min-h-screen">

<!-- LİSANS / DEMO KİLİT MODALI -->
<div id="licenseLockOverlay" class="fixed inset-0 z-[10000] bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-700/80 rounded-2xl p-6 shadow-2xl text-center relative overflow-hidden">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 text-slate-950 flex items-center justify-center mx-auto mb-4 text-2xl font-black shadow-lg shadow-amber-500/20">
            <i class="fas fa-shield-halved"></i>
        </div>
        <h2 class="text-xl font-bold text-white mb-1">Aktivasyon & Doğrulama</h2>
        <p class="text-xs text-slate-400 mb-6">Sistemi kullanmak için Demo veya Tam Sürüm Lisans Anahtarınızı giriniz.</p>
        
        <div class="space-y-4">
            <div>
                <input type="text" id="licenseKeyInput" placeholder="XXXX-XXXX-XXXX" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-center font-mono text-base tracking-widest text-amber-400 focus:border-amber-500 focus:outline-none uppercase transition">
            </div>
            <button onclick="verifyLicenseKey()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-amber-500/10 active:scale-[0.98]">Sistemi Etkinleştir</button>
        </div>

        <!-- Hata ve Bilgi Mesajları -->
        <div id="licenseError" class="mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-xs text-red-400 hidden flex items-center gap-2 text-left">
            <i class="fas fa-circle-exclamation text-base shrink-0"></i>
            <span id="licenseErrorText"></span>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-500">
            <span><i class="fas fa-clock mr-1"></i> Demo: 15 Gün (Tek Cihaz)</span>
            <span><i class="fas fa-certificate mr-1"></i> Tam Sürüm: 1 Yıl</span>
        </div>
    </div>
</div>

<!-- UYGULAMA İÇERİĞİ -->
<div id="appContainer" class="p-6 max-w-7xl mx-auto">
    <div class="glass-card p-6 rounded-2xl shadow-xl flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-meb-primary dark:text-amber-400">MEB İSG Hizmet & Puantaj Yönetim Sistemi</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" id="activeLicenseInfo">Lisans Durumu: Kontrol Ediliyor...</p>
        </div>
        <div class="flex gap-2">
            <button onclick="downloadKeysTXT()" class="px-4 py-2 bg-slate-800 text-amber-400 text-xs font-semibold rounded-lg border border-slate-700 hover:bg-slate-700 transition flex items-center gap-2">
                <i class="fas fa-file-arrow-down"></i> Anahtar Listelerini İndir (TXT)
            </button>
            <button onclick="resetLicense()" class="px-3 py-2 bg-red-600/20 text-red-400 hover:bg-red-600/30 text-xs font-semibold rounded-lg border border-red-500/30 transition">
                Lisansı Sıfırla
            </button>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // LİSANS VERİTABANI OLUŞTURUCU (500 DEMO + 1000 TAM SÜRÜM)
    // =========================================================================
    
    function generateKey(prefix, index) {
        const pad = String(index).padStart(4, '0');
        const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
        return `${prefix}-${pad}-${rand}`;
    }

    // 500 Demo Anahtarı Üret (DEMO-XXXX-YYYY)
    const DEMO_KEYS = Array.from({ length: 500 }, (_, i) => generateKey('DEMO', i + 1));
    
    // 1000 Tam Sürüm Anahtarı Üret (FULL-XXXX-YYYY)
    const FULL_KEYS = Array.from({ length: 1000 }, (_, i) => generateKey('FULL', i + 1));

    // =========================================================================
    // CİHAZ KİMLİĞİ (FINGERPRINT)
    // =========================================================================
    function getDeviceId() {
        let devId = localStorage.getItem('isg_device_id');
        if (!devId) {
            devId = 'DEV-' + Math.random().toString(36).substring(2, 15) + '-' + Date.now().toString(36);
            localStorage.setItem('isg_device_id', devId);
        }
        return devId;
    }

    // global demo kullanım kaydı simülasyonu
    function getDemoRegistry() {
        return JSON.parse(localStorage.getItem('isg_demo_global_registry') || '{}');
    }

    function setDemoRegistry(registry) {
        localStorage.setItem('isg_demo_global_registry', JSON.stringify(registry));
    }

    // =========================================================================
    // LİSANS DOĞRULAMA MOTORU
    // =========================================================================
    function checkLicenseStatus() {
        const activeLicense = JSON.parse(localStorage.getItem('isg_active_license') || 'null');
        const overlay = document.getElementById('licenseLockOverlay');
        const errBox = document.getElementById('licenseError');
        const errText = document.getElementById('licenseErrorText');
        const infoText = document.getElementById('activeLicenseInfo');

        if (!activeLicense) {
            overlay.classList.remove('hidden');
            return;
        }

        const now = Date.now();
        const currentDevice = getDeviceId();

        // 1. DEMO KONTROLÜ
        if (activeLicense.type === 'DEMO') {
            // Cihaz Kilit Kontrolü
            if (activeLicense.deviceId !== currentDevice) {
                overlay.classList.remove('hidden');
                errBox.classList.remove('hidden');
                errText.innerHTML = "Bu demo anahtarı başka bir cihazda zaten aktif edilmiş!<br><b>Lütfen Tam Sürüm Lisans Anahtarı edinin.</b>";
                return;
            }

            // 15 Günlük Süre Kontrolü
            const daysLeft = Math.ceil((activeLicense.expiresAt - now) / (1000 * 60 * 60 * 24));
            if (now > activeLicense.expiresAt) {
                overlay.classList.remove('hidden');
                errBox.classList.remove('hidden');
                errText.innerHTML = "Demo süreniz (15 gün) dolmuştur.<br><b>Sistemi kullanmaya devam etmek için lütfen Tam Sürüm Lisans Anahtarı edinin!</b>";
                return;
            }

            overlay.classList.add('hidden');
            infoText.innerHTML = `<span class="text-amber-500 font-semibold">Demo Sürüm</span> (Kalan Süre: ${daysLeft} Gün - Cihaza Özel)`;
        } 
        
        // 2. TAM SÜRÜM KONTROLÜ
        else if (activeLicense.type === 'FULL') {
            const daysLeft = Math.ceil((activeLicense.expiresAt - now) / (1000 * 60 * 60 * 24));
            if (now > activeLicense.expiresAt) {
                overlay.classList.remove('hidden');
                errBox.classList.remove('hidden');
                errText.innerHTML = "1 Yıllık Tam Sürüm lisans süreniz dolmuştur.<br>Lütfen yeni bir lisans anahtarı giriniz.";
                return;
            }

            overlay.classList.add('hidden');
            infoText.innerHTML = `<span class="text-green-500 font-semibold">Tam Sürüm (1 Yıllık Lisans)</span> - Kalan Süre: ${daysLeft} Gün`;
        }
    }

    function verifyLicenseKey() {
        const inputKey = document.getElementById('licenseKeyInput').value.trim().toUpperCase();
        const errBox = document.getElementById('licenseError');
        const errText = document.getElementById('licenseErrorText');
        
        errBox.classList.add('hidden');

        if (!inputKey) {
            errText.textContent = "Lütfen geçerli bir lisans anahtarı giriniz.";
            errBox.classList.remove('hidden');
            return;
        }

        const now = Date.now();
        const currentDevice = getDeviceId();

        // DEMO ANAHTAR KONTROLÜ
        if (DEMO_KEYS.includes(inputKey)) {
            const registry = getDemoRegistry();

            // Eğer bu demo anahtarı başka cihaz tarafından kullanılmışsa
            if (registry[inputKey] && registry[inputKey] !== currentDevice) {
                errText.innerHTML = "Bu demo şifresi başka bir cihazda zaten kullanılmıştır!<br><b>LÜTFEN TAM SÜRÜM LİSANS ANAHTARI EDİNİN.</b>";
                errBox.classList.remove('hidden');
                return;
            }

            // İlk aktivasyon: Cihaza kilitle ve 15 gün başlat
            registry[inputKey] = currentDevice;
            setDemoRegistry(registry);

            const demoData = {
                key: inputKey,
                type: 'DEMO',
                deviceId: currentDevice,
                activatedAt: now,
                expiresAt: now + (15 * 24 * 60 * 60 * 1000) // 15 Gün
            };

            localStorage.setItem('isg_active_license', JSON.stringify(demoData));
            checkLicenseStatus();
            return;
        }

        // TAM SÜRÜM ANAHTAR KONTROLÜ
        if (FULL_KEYS.includes(inputKey)) {
            const fullData = {
                key: inputKey,
                type: 'FULL',
                activatedAt: now,
                expiresAt: now + (365 * 24 * 60 * 60 * 1000) // 1 Yıl (365 Gün)
            };

            localStorage.setItem('isg_active_license', JSON.stringify(fullData));
            checkLicenseStatus();
            return;
        }

        // GEÇERSİZ ANAHTAR
        errText.textContent = "Girdiğiniz lisans anahtarı geçersizdir. Lütfen kontrol edip tekrar deneyiniz.";
        errBox.classList.remove('hidden');
    }

    function resetLicense() {
        if(confirm("Mevcut lisans bilgileriniz silinecek ve kilit ekranı açılacaktır. Onaylıyor musunuz?")) {
            localStorage.removeItem('isg_active_license');
            location.reload();
        }
    }

    // TXT DOSYASI OLARAK İNDİRME
    function downloadKeysTXT() {
        const textContent = `=== MEB İSG SİSTEMİ LİSANS ANAHTARLARI ===\n\n` +
            `--- 500 ADET DEMO LİSANS ANAHTARI (15 Günlük & Tek Cihaz Kilitli) ---\n` +
            DEMO_KEYS.join('\n') +
            `\n\n--- 1000 ADET TAM SÜRÜM LİSANS ANAHTARI (1 Yıllık Geçerli) ---\n` +
            FULL_KEYS.join('\n');

        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'MEB_ISG_Lisans_Anahtarlari_Listesi.txt';
        a.click();
    }

    // Sayfa Yüklendiğinde Otomatik Çalıştır
    window.addEventListener('DOMContentLoaded', () => {
        checkLicenseStatus();
    });
</script>
</body>
</html>
